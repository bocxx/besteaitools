# ── Newsletter (Resend) — secrets, zet via `wrangler secret put <NAAM>` ──────
#   RESEND_API_KEY        (vereist voor live inschrijven; zonder = stub)
#   RESEND_AUDIENCE_ID    (optioneel — laat aanmeldingen in een aparte
#                          "debesteaitools"-audience landen, per site gescheiden)
#   RESEND_WELCOME_FROM   (optioneel — geverifieerd from-adres voor de welkomstmail)
# Elk contact krijgt sowieso property signup_site = "debesteaitools.nl".
# ─────────────────────────────────────────────────────────────────────────────
name = "debesteaitools"
compatibility_date = "2026-03-27"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true
preview_urls = true

routes = [
  { pattern = "debesteaitools.nl", custom_domain = true },
  { pattern = "www.debesteaitools.nl", custom_domain = true },
]

[assets]
directory = "./dist"
not_found_handling = "404-page"
# Trailing-slash-normalisatie op de ASSET-laag (niet in middleware!). De site
# is sitewide canoniek zónder trailing slash; drop-trailing-slash serveert de
# no-slash-vorm met 200 en 308't `/pad/` → `/pad`. Dit hoort hier thuis omdat
# Workers Assets statische HTML rechtstreeks serveert — de Worker draait daar
# (zeker met edge-cache HITs) niet betrouwbaar op, dus een redirect in de
# middleware was zowel onbetrouwbaar runtime ALS fataal tijdens de build
# (elke prerender kreeg de 308 en werd een "Redirecting…"-stub, juli 2026).
html_handling = "drop-trailing-slash"
# Worker draait vóór static assets. Oorspronkelijk aangezet voor Link headers
# en markdown-negotiation via middleware op prerendered pagina's.
#
# GEMETEN 25 aug 2026 — dat werkt niet, en de oorzaak is niet de edge-cache
# (zoals de juli-audit vermoedde) maar Astro zelf: middleware draait per
# ontwerp NIET op request-tijd voor prerendered pagina's. Live bevestigd:
# geen Link-header op /beste-ai-tools, `Accept: text/markdown` op
# /ai-tools/chatgpt geeft gewoon HTML, /.well-known/api-catalog komt zonder
# Content-Type terug.
#
# Uitzetten is geprobeerd en gemeten (wrangler dev reproduceert productie
# 1-op-1: /radar/ 308, /ai-tools/chatgpt/ 200, in beide omgevingen gelijk).
# Resultaat: exact hetzelfde gedrag — /tools/ blijft 200, _redirects blijft
# rewriten, SSR-routes blijven werken. Deze vlag doet dus feitelijk niets.
# Bewust laten staan: omzetten is een productie-routingwijziging zonder
# gemeten voordeel. Niet opnieuw uitproberen zonder nieuwe aanleiding.
run_worker_first = true

[observability]
enabled = true
