<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="cp-t cp-d">
  <title id="cp-t">Welke Microsoft Copilot heb je nodig?</title>
  <desc id="cp-d">Beslisschema. Wil je alleen chatten, vragen stellen en documenten laten samenvatten, dan volstaat gratis Copilot met een Microsoft-account. Wil je Copilot in Word, Excel en PowerPoint: op je werk regelt je organisatie Copilot Chat of een Microsoft 365 Copilot-licentie; privé kies je Microsoft 365 Personal voor jezelf, Family als je opslag deelt (AI alleen voor de eigenaar) of Premium voor de ruimste limieten en de agents Onderzoeker en Analist. Microsoft 365 Basic heeft geen AI.</desc>
  <defs>
    <style>
      .bg{fill:#111418}
      .box{fill:#1a1f26;stroke:#3a4352;stroke-width:1.5}
      .hl{fill:#1a1f26;stroke:#f1cf2a;stroke-width:2}
      .q{fill:#111418;stroke:#94a6be;stroke-width:1.5}
      .t{fill:#f1f5fc;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:16px}
      .s{fill:#94a6be;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px}
      .k{fill:#f1cf2a;font-family:'JetBrains Mono',Menlo,monospace;font-size:11.5px;letter-spacing:1px}
      .a{fill:none;stroke:#94a6be;stroke-width:1.5}
      .x{fill:#7a8597;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;font-style:italic}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#94a6be"/></marker>
  </defs>
  <rect class="bg" width="880" height="500" rx="14"/>
  <text x="28" y="38" class="k">WELKE COPILOT HEB JE NODIG?</text>

  <g transform="translate(270,58)">
    <rect class="q" width="340" height="62" rx="10"/>
    <text class="t" x="20" y="27">Wil je Copilot ín Word, Excel</text>
    <text class="t" x="20" y="47">en PowerPoint?</text>
  </g>

  <path class="a" d="M340 120 L170 168" marker-end="url(#ar)"/>
  <path class="a" d="M540 120 L640 168" marker-end="url(#ar)"/>
  <text x="196" y="146" class="k">NEE</text>
  <text x="606" y="146" class="k">JA</text>

  <g transform="translate(28,172)">
    <rect class="hl" width="300" height="128" rx="10"/>
    <text class="k" x="18" y="28">GRATIS COPILOT</text>
    <text class="t" x="18" y="56">Microsoft-account volstaat</text>
    <text class="s" x="18" y="80">Chatten, vragen over het web, teksten</text>
    <text class="s" x="18" y="98">schrijven, bestanden samenvatten.</text>
    <text class="s" x="18" y="116">Web, Windows, Edge en de app.</text>
  </g>

  <g transform="translate(470,172)">
    <rect class="q" width="340" height="56" rx="10"/>
    <text class="t" x="20" y="34">Voor je werk of privé?</text>
  </g>

  <path class="a" d="M560 228 L470 290" marker-end="url(#ar)"/>
  <path class="a" d="M720 228 L720 290" marker-end="url(#ar)"/>
  <text x="470" y="262" class="k">WERK</text>
  <text x="732" y="262" class="k">PRIVÉ</text>

  <g transform="translate(360,296)">
    <rect class="box" width="230" height="150" rx="10"/>
    <text class="k" x="16" y="28">VIA JE ORGANISATIE</text>
    <text class="t" x="16" y="56">Copilot Chat</text>
    <text class="s" x="16" y="78">Zit bij zakelijk Microsoft 365.</text>
    <text class="s" x="16" y="98">In de apps zelf: een aparte</text>
    <text class="s" x="16" y="116">Microsoft 365 Copilot-licentie.</text>
    <text class="s" x="16" y="136">Log in met je werkaccount.</text>
  </g>

  <g transform="translate(608,296)">
    <rect class="box" width="244" height="150" rx="10"/>
    <text class="k" x="16" y="28">MICROSOFT 365</text>
    <text class="t" x="16" y="54">Personal</text><text class="s" x="96" y="54">alleen jij</text>
    <text class="t" x="16" y="82">Family</text><text class="s" x="96" y="82">AI alleen voor eigenaar</text>
    <text class="t" x="16" y="110">Premium</text><text class="s" x="96" y="110">ruimste limieten,</text>
    <text class="s" x="96" y="128">Onderzoeker en Analist</text>
  </g>

  <text x="28" y="478" class="x">Let op: Microsoft 365 Basic heeft geen AI-functies. Prijzen: zie Stand van zaken in het artikel.</text>
</svg>
