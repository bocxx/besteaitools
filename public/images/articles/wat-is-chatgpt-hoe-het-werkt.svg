<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="wc-t wc-d">
  <title id="wc-t">Hoe ChatGPT een antwoord maakt</title>
  <desc id="wc-d">Schema in drie stappen. Stap één: jij typt een vraag of opdracht, de prompt. Stap twee: het taalmodel voorspelt het antwoord woord voor woord, op basis van patronen uit zijn training. Bij een vraag over iets actueels kan ChatGPT eerst op het web zoeken en dan bronlinks tonen. Stap drie: het antwoord. Dat klinkt zeker, maar kan fout zijn, dus controleer belangrijke feiten. Is het antwoord niet goed, dan vraag je door: het gesprek loopt verder. Onderaan: de kennis komt uit training op openbare teksten van internet, data via partners en input van gebruikers en trainers. Het model bewaart geen kopie van die teksten en zoekt dus niet op in een opgeslagen archief.</desc>
  <defs>
    <style>
      .bg{fill:#111418}
      .box{fill:#1a1f26;stroke:#3a4352;stroke-width:1.5}
      .hl{fill:#1a1f26;stroke:#f1cf2a;stroke-width:2}
      .dash{fill:#1a1f26;stroke:#94a6be;stroke-width:1.5;stroke-dasharray:6 5}
      .t{fill:#f1f5fc;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:19px}
      .s{fill:#94a6be;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:16px}
      .k{fill:#f1cf2a;font-family:Menlo,Consolas,monospace;font-size:15px;letter-spacing:1px}
      .a{fill:none;stroke:#94a6be;stroke-width:1.5}
    </style>
    <marker id="wca" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#94a6be"/></marker>
  </defs>
  <rect class="bg" width="880" height="480" rx="14"/>
  <text x="28" y="44" class="k">HOE CHATGPT EEN ANTWOORD MAAKT</text>

  <g transform="translate(28,70)">
    <rect class="box" width="244" height="132" rx="10"/>
    <text class="t" x="18" y="38">1. Jouw vraag</text>
    <text class="s" x="18" y="70">Je typt een vraag of</text>
    <text class="s" x="18" y="92">opdracht: de prompt</text>

    <rect class="hl" x="292" width="244" height="132" rx="10"/>
    <text class="t" x="310" y="38">2. Het taalmodel</text>
    <text class="s" x="310" y="70">Voorspelt het antwoord</text>
    <text class="s" x="310" y="92">woord voor woord, op</text>
    <text class="s" x="310" y="114">basis van zijn training</text>

    <rect class="box" x="584" width="240" height="132" rx="10"/>
    <text class="t" x="602" y="38">3. Het antwoord</text>
    <text class="s" x="602" y="70">Klinkt zeker, maar kan</text>
    <text class="s" x="602" y="92">fout zijn: controleer</text>
    <text class="s" x="602" y="114">belangrijke feiten</text>

    <path class="a" d="M248 66 L286 66" marker-end="url(#wca)"/>
    <path class="a" d="M540 66 L578 66" marker-end="url(#wca)"/>

    <path class="a" d="M400 136 L400 170" marker-end="url(#wca)"/>
    <path class="a" d="M428 172 L428 138" marker-end="url(#wca)"/>
    <rect class="dash" x="292" y="176" width="244" height="80" rx="10"/>
    <text class="s" x="310" y="208">Soms eerst: zoeken op</text>
    <text class="s" x="310" y="232">het web, met bronlinks</text>

    <path class="a" d="M704 136 L704 170" marker-end="url(#wca)"/>
    <rect class="box" x="584" y="176" width="240" height="80" rx="10"/>
    <text class="s" x="602" y="208">Niet goed? Vraag door,</text>
    <text class="s" x="602" y="232">het gesprek loopt verder</text>
  </g>

  <g transform="translate(28,356)">
    <text class="k" x="0" y="0">WAAR KOMT DE KENNIS VANDAAN?</text>
    <rect class="box" y="16" width="824" height="84" rx="10"/>
    <text class="s" x="18" y="50">Training op openbare teksten van internet, data via partners en input van</text>
    <text class="s" x="18" y="76">gebruikers en trainers. Het model bewaart geen kopie van die teksten.</text>
  </g>
</svg>
