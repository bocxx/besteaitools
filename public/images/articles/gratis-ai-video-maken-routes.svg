<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="vr-t vr-d">
  <title id="vr-t">Gratis AI-video maken: twee routes</title>
  <desc id="vr-d">Schema met twee gratis routes om een AI-video te maken. Route één, van tekst naar video: beschrijf de scène en kies Dreamina met dagelijkse gratis credits, of de AI-videogenerator van CapCut als je de clip meteen wilt monteren. Route twee, van foto naar video: upload een foto als startbeeld in Dreamina, of gebruik in CapCut een foto als eerste frame. Onderaan: niet meer gratis zijn video in de Gemini-app, de videoclip-tool van Canva, Pika en Luma. Limieten en cliplengtes staan in de Stand van zaken onder het artikel.</desc>
  <defs>
    <style>
      .bg{fill:#111418}
      .box{fill:#1a1f26;stroke:#3a4352;stroke-width:1.5}
      .hl{fill:#1a1f26;stroke:#f1cf2a;stroke-width:2}
      .t{fill:#f1f5fc;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:17px}
      .s{fill:#94a6be;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13px}
      .k{fill:#f1cf2a;font-family:Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px}
      .a{fill:none;stroke:#94a6be;stroke-width:1.5}
    </style>
    <marker id="var" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#94a6be"/></marker>
  </defs>
  <rect class="bg" width="880" height="470" rx="14"/>
  <text x="28" y="40" class="k">GRATIS AI-VIDEO: KIES JE ROUTE</text>
  <text x="28" y="76" class="k">JE BEGINT MET</text>
  <text x="330" y="76" class="k">BEGIN MET</text>
  <text x="610" y="76" class="k">ALTERNATIEF</text>

  <g transform="translate(28,92)">
    <rect class="box" width="260" height="96" rx="10"/>
    <text class="t" x="18" y="40">Tekst</text>
    <text class="s" x="18" y="64">Beschrijf scène, beweging</text>
    <text class="s" x="18" y="82">en camera</text>
    <rect class="hl" x="302" width="258" height="96" rx="10"/>
    <text class="t" x="320" y="40">Dreamina</text>
    <text class="s" x="320" y="64">Elke dag gratis credits</text>
    <rect class="box" x="582" width="242" height="96" rx="10"/>
    <text class="t" x="600" y="40">CapCut</text>
    <text class="s" x="600" y="64">AI-videogenerator,</text>
    <text class="s" x="600" y="82">meteen monteren</text>
    <path class="a" d="M264 48 L296 48" marker-end="url(#var)"/>
  </g>

  <g transform="translate(28,204)">
    <rect class="box" width="260" height="96" rx="10"/>
    <text class="t" x="18" y="40">Foto</text>
    <text class="s" x="18" y="64">Beschrijf alleen wat</text>
    <text class="s" x="18" y="82">er moet bewegen</text>
    <rect class="hl" x="302" width="258" height="96" rx="10"/>
    <text class="t" x="320" y="40">Dreamina</text>
    <text class="s" x="320" y="64">Foto als startbeeld</text>
    <rect class="box" x="582" width="242" height="96" rx="10"/>
    <text class="t" x="600" y="40">CapCut</text>
    <text class="s" x="600" y="64">Foto als eerste frame</text>
    <path class="a" d="M264 48 L296 48" marker-end="url(#var)"/>
  </g>

  <g transform="translate(28,326)">
    <text class="k" x="0" y="0">NIET MEER GRATIS</text>
    <rect class="box" y="16" width="824" height="72" rx="10"/>
    <text class="s" x="18" y="46">Video in de Gemini-app · videoclip-tool van Canva · Pika · Luma</text>
    <text class="s" x="18" y="70">Limieten en cliplengtes: zie Stand van zaken onder het artikel</text>
  </g>
</svg>
