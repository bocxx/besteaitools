<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="tr-t tr-d">
  <title id="tr-t">Gratis AI-afbeelding maken: van zonder account naar betaald</title>
  <desc id="tr-d">Trap met drie treden. Trede 1, zonder account: kort proberen in openbare demo's op Hugging Face, met weinig rekentijd per dag en een lage plek in de wachtrij. Trede 2, gratis account bij Adobe Firefly, Ideogram, Leonardo of Canva: een dagelijks, wekelijks of maandelijks tegoed; bij Ideogram en Leonardo zijn je beelden openbaar. Trede 3, betaald abonnement: meer tegoed, privé genereren en de zwaardere modellen.</desc>
  <defs>
    <style>
      .bg{fill:#111418}
      .box{fill:#1a1f26;stroke:#3a4352;stroke-width:1.5}
      .hl{fill:#1a1f26;stroke:#f1cf2a;stroke-width:2}
      .t{fill:#f1f5fc;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:17px}
      .s{fill:#94a6be;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13px}
      .k{fill:#f1cf2a;font-family:Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px}
      .a{fill:none;stroke:#94a6be;stroke-width:1.5}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#94a6be"/></marker>
  </defs>
  <rect class="bg" width="880" height="440" rx="14"/>
  <text x="28" y="40" class="k">GRATIS AI-BEELD: WAT JE PER TREDE KRIJGT</text>

  <g transform="translate(28,268)">
    <rect class="box" width="250" height="142" rx="10"/>
    <text class="k" x="18" y="28">1 · ZONDER ACCOUNT</text>
    <text class="t" x="18" y="56">Kort proberen</text>
    <text class="s" x="18" y="80">Openbare demo's op Hugging Face.</text>
    <text class="s" x="18" y="99">Weinig rekentijd per dag,</text>
    <text class="s" x="18" y="118">lage plek in de wachtrij.</text>
  </g>

  <g transform="translate(305,170)">
    <rect class="hl" width="270" height="240" rx="10"/>
    <text class="k" x="18" y="28">2 · GRATIS ACCOUNT</text>
    <text class="t" x="18" y="56">Hier begin je meestal</text>
    <text class="s" x="18" y="82">Adobe Firefly: dagelijks tegoed</text>
    <text class="s" x="18" y="102">Ideogram: wekelijks tegoed</text>
    <text class="s" x="18" y="122">Leonardo: dagelijks tegoed</text>
    <text class="s" x="18" y="142">Canva: maandelijks tegoed</text>
    <text class="s" x="18" y="174">Let op: bij Ideogram en Leonardo</text>
    <text class="s" x="18" y="194">zijn gratis beelden openbaar.</text>
  </g>

  <g transform="translate(602,72)">
    <rect class="box" width="250" height="338" rx="10"/>
    <text class="k" x="18" y="28">3 · BETAALD</text>
    <text class="t" x="18" y="56">Als gratis knelt</text>
    <text class="s" x="18" y="82">Meer tegoed per maand.</text>
    <text class="s" x="18" y="102">Privé genereren.</text>
    <text class="s" x="18" y="122">Zwaardere modellen en</text>
    <text class="s" x="18" y="142">hogere kwaliteit.</text>
    <text class="s" x="18" y="174">Prijzen: zie Stand van zaken</text>
    <text class="s" x="18" y="194">onder het artikel.</text>
  </g>

  <path class="a" d="M200 258 L300 210" marker-end="url(#ar)"/>
  <path class="a" d="M500 160 L596 112" marker-end="url(#ar)"/>
</svg>
