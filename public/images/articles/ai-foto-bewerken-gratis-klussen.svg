<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="kl-t kl-d">
  <title id="kl-t">AI foto bewerken gratis: welke tool voor welke klus</title>
  <desc id="kl-d">Schema met vier fotoklussen en per klus de gratis tool om mee te beginnen, plus een alternatief. Achtergrond weghalen: begin met Photoroom, dat zonder account werkt; alternatieven Adobe Firefly en Canva. Object of persoon wissen: begin met Clipdrop Cleanup; alternatief Photoroom Retouch. Opschalen of scherper maken: begin met de Clipdrop Image Upscaler; alternatief de Image Upscaler van Canva. Belichting aanpassen: Clipdrop Relight. Limieten en resolutie van de gratis versies staan in de Stand van zaken onder het artikel.</desc>
  <defs>
    <style>
      .bg{fill:#111418}
      .box{fill:#1a1f26;stroke:#3a4352;stroke-width:1.5}
      .hl{fill:#1a1f26;stroke:#f1cf2a;stroke-width:2}
      .t{fill:#f1f5fc;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:17px}
      .s{fill:#94a6be;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13px}
      .k{fill:#f1cf2a;font-family:Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px}
      .a{fill:none;stroke:#94a6be;stroke-width:1.5}
    </style>
    <marker id="kar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#94a6be"/></marker>
  </defs>
  <rect class="bg" width="880" height="470" rx="14"/>
  <text x="28" y="40" class="k">GRATIS AI-FOTOBEWERKING: KIES PER KLUS</text>
  <text x="28" y="76" class="k">DE KLUS</text>
  <text x="330" y="76" class="k">BEGIN MET</text>
  <text x="610" y="76" class="k">ALTERNATIEF</text>

  <g transform="translate(28,92)">
    <rect class="box" width="260" height="76" rx="10"/>
    <text class="t" x="18" y="34">Achtergrond weghalen</text>
    <text class="s" x="18" y="56">Product of persoon vrijstaand</text>
    <rect class="hl" x="302" width="258" height="76" rx="10"/>
    <text class="t" x="320" y="34">Photoroom</text>
    <text class="s" x="320" y="56">Werkt ook zonder account</text>
    <rect class="box" x="582" width="242" height="76" rx="10"/>
    <text class="s" x="600" y="34">Adobe Firefly</text>
    <text class="s" x="600" y="56">Canva</text>
    <path class="a" d="M264 38 L296 38" marker-end="url(#kar)"/>
  </g>

  <g transform="translate(28,184)">
    <rect class="box" width="260" height="76" rx="10"/>
    <text class="t" x="18" y="34">Object of persoon wissen</text>
    <text class="s" x="18" y="56">Toerist, kabel, vuilnisbak</text>
    <rect class="hl" x="302" width="258" height="76" rx="10"/>
    <text class="t" x="320" y="34">Clipdrop Cleanup</text>
    <text class="s" x="320" y="56">Kwast over wat weg moet</text>
    <rect class="box" x="582" width="242" height="76" rx="10"/>
    <text class="s" x="600" y="34">Photoroom Retouch</text>
    <path class="a" d="M264 38 L296 38" marker-end="url(#kar)"/>
  </g>

  <g transform="translate(28,276)">
    <rect class="box" width="260" height="76" rx="10"/>
    <text class="t" x="18" y="34">Opschalen, scherper</text>
    <text class="s" x="18" y="56">Kleine of zachte foto</text>
    <rect class="hl" x="302" width="258" height="76" rx="10"/>
    <text class="t" x="320" y="34">Clipdrop Image Upscaler</text>
    <text class="s" x="320" y="56">Controleer gezichten en tekst</text>
    <rect class="box" x="582" width="242" height="76" rx="10"/>
    <text class="s" x="600" y="34">Canva Image Upscaler</text>
    <path class="a" d="M264 38 L296 38" marker-end="url(#kar)"/>
  </g>

  <g transform="translate(28,368)">
    <rect class="box" width="260" height="76" rx="10"/>
    <text class="t" x="18" y="34">Belichting aanpassen</text>
    <text class="s" x="18" y="56">Te donker of vlak licht</text>
    <rect class="hl" x="302" width="258" height="76" rx="10"/>
    <text class="t" x="320" y="34">Clipdrop Relight</text>
    <text class="s" x="320" y="56">Licht achteraf bijwerken</text>
    <rect class="box" x="582" width="242" height="76" rx="10"/>
    <text class="s" x="600" y="34">Limieten: zie Stand van zaken</text>
    <text class="s" x="600" y="56">onder het artikel</text>
    <path class="a" d="M264 38 L296 38" marker-end="url(#kar)"/>
  </g>
</svg>
