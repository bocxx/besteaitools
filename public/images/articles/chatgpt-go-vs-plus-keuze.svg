<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="go-t go-d">
  <title id="go-t">Gratis, Go of Plus?</title>
  <desc id="go-d">Beslisschema voor een ChatGPT-abonnement. Vraag 1: loop je in de gratis versie tegen limieten aan? Nee: blijf gratis. Ja: vraag 2: heb je het sterkere redeneermodel, ruimer deep research, Codex of ChatGPT Work nodig, of wil je geen reclame? Nee: Go, met meer uploads, afbeeldingen en geheugen op hetzelfde lichtere model, met reclame. Ja: Plus, met het sterkere redeneermodel, ruimere limieten en zonder reclame. Pro is voor zwaar dagelijks gebruik. Prijzen staan in de Stand van zaken van het artikel.</desc>
  <defs>
    <style>
      .bg{fill:#111418}
      .box{fill:#1a1f26;stroke:#3a4352;stroke-width:1.5}
      .hl{fill:#1a1f26;stroke:#f1cf2a;stroke-width:2}
      .q{fill:#111418;stroke:#94a6be;stroke-width:1.5}
      .t{fill:#f1f5fc;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:16px}
      .s{fill:#94a6be;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:12.5px}
      .k{fill:#f1cf2a;font-family:Menlo,'DejaVu Sans Mono',monospace;font-size:11.5px;letter-spacing:1px}
      .a{fill:none;stroke:#94a6be;stroke-width:1.5}
      .x{fill:#94a6be;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:12px;font-style:italic}
    </style>
    <marker id="go-ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#94a6be"/></marker>
  </defs>
  <rect class="bg" width="880" height="470" rx="14"/>
  <text x="28" y="38" class="k">GRATIS, GO OF PLUS?</text>

  <g transform="translate(250,56)">
    <rect class="q" width="380" height="62" rx="10"/>
    <text class="t" x="20" y="27">Loop je in de gratis versie tegen</text>
    <text class="t" x="20" y="47">limieten aan?</text>
  </g>
  <path class="a" d="M320 118 L170 170" marker-end="url(#go-ar)"/>
  <path class="a" d="M560 118 L640 170" marker-end="url(#go-ar)"/>
  <text x="206" y="146" class="k">NEE</text>
  <text x="614" y="146" class="k">JA</text>

  <g transform="translate(28,174)">
    <rect class="box" width="270" height="110" rx="10"/>
    <text class="k" x="18" y="28">GRATIS</text>
    <text class="t" x="18" y="56">Blijf gratis</text>
    <text class="s" x="18" y="80">Onbeperkt tekstgesprekken,</text>
    <text class="s" x="18" y="98">beperkte uploads en beeld.</text>
  </g>

  <g transform="translate(420,174)">
    <rect class="q" width="432" height="82" rx="10"/>
    <text class="t" x="20" y="28">Heb je het sterkere model, deep research,</text>
    <text class="t" x="20" y="50">Codex of Work nodig, of wil je geen</text>
    <text class="t" x="20" y="72">reclame?</text>
  </g>
  <path class="a" d="M530 256 L470 304" marker-end="url(#go-ar)"/>
  <path class="a" d="M740 256 L740 304" marker-end="url(#go-ar)"/>
  <text x="456" y="284" class="k">NEE</text>
  <text x="752" y="284" class="k">JA</text>

  <g transform="translate(340,310)">
    <rect class="box" width="250" height="118" rx="10"/>
    <text class="k" x="16" y="28">GO</text>
    <text class="t" x="16" y="54">Meer ruimte, zelfde model</text>
    <text class="s" x="16" y="78">Meer uploads, afbeeldingen</text>
    <text class="s" x="16" y="96">en geheugen. Met reclame.</text>
  </g>

  <g transform="translate(608,310)">
    <rect class="hl" width="244" height="118" rx="10"/>
    <text class="k" x="16" y="28">PLUS</text>
    <text class="t" x="16" y="54">Sterker redeneermodel</text>
    <text class="s" x="16" y="78">Ruimere limieten op vrijwel</text>
    <text class="s" x="16" y="96">alles. Zonder reclame.</text>
  </g>

  <text x="28" y="454" class="x">Zwaar dagelijks gebruik? Kijk naar Pro. Prijzen: zie Stand van zaken in het artikel.</text>
</svg>
